<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Combo Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#1b222c">
</head>
<body>
    <div class="app-container">
        <!-- Верхняя панель управления (как в референсе) -->
        <header class="top-bar">
            <div class="menu-pill">
                <button class="pill-btn active" data-tab="tuner">Тюнер</button>
                <button class="pill-btn" data-tab="metronome">Метроном</button>
            </div>
            <div class="ref-indicator">
                <span>A4 = 440Hz</span>
            </div>
        </header>

        <!-- ВКЛАДКА ТЮНЕР -->
        <main id="tuner-tab" class="tab-content active">
            <!-- Аналоговая шкала-спидометр -->
            <div class="analog-panel">
                <div class="gauge-container">
                    <!-- Циферблат со шкалой -->
                    <svg class="gauge-svg" viewBox="0 0 200 105">
                        <!-- Деления шкалы -->
                        <g class="ticks" stroke="#4a5568" stroke-width="1.5">
                            <!-- -50 до +50 с шагом -->
                            <line x1="100" y1="10" x2="100" y2="18" stroke="#2ecc71" stroke-width="2.5" />
                            <line x1="80" y1="11.5" x2="80" y2="17" stroke="#cbd5e1" />
                            <line x1="60" y1="16" x2="60" y2="21" stroke="#cbd5e1" />
                            <line x1="40" y1="23.5" x2="40" y2="28" stroke="#cbd5e1" />
                            <line x1="22" y1="34" x2="23.5" y2="38" stroke="#ef4444" />
                            <line x1="120" y1="11.5" x2="120" y2="17" stroke="#cbd5e1" />
                            <line x1="140" y1="16" x2="140" y2="21" stroke="#cbd5e1" />
                            <line x1="160" y1="23.5" x2="160" y2="28" stroke="#cbd5e1" />
                            <line x1="178" y1="34" x2="176.5" y2="38" stroke="#ef4444" />
                        </g>
                        <!-- Цифры шкалы -->
                        <text x="100" y="30" fill="#2ecc71" font-size="7" font-weight="bold" text-anchor="middle">0</text>
                        <text x="60" y="33" fill="#94a3b8" font-size="6" text-anchor="middle">-20</text>
                        <text x="140" y="33" fill="#94a3b8" font-size="6" text-anchor="middle">+20</text>
                        <text x="25" y="48" fill="#ef4444" font-size="6" text-anchor="middle">-50</text>
                        <text x="175" y="48" fill="#ef4444" font-size="6" text-anchor="middle">+50</text>
                    </svg>

                    <!-- Стрелка спидометра -->
                    <div class="speedo-pivot">
                        <div class="speedo-needle" id="speedo-needle"></div>
                    </div>

                    <!-- Плашка центов внутри циферблата -->
                    <div class="cents-badge" id="cents-badge">0 ¢</div>
                </div>

                <div class="sub-freq-row">
                    <span id="string-hint">Ожидание сигнала...</span>
                    <span id="frequency">0.0 Hz</span>
                </div>
            </div>

            <!-- Большой блок ноты -->
            <div class="note-card">
                <div id="note" class="massive-note">--</div>
            </div>

            <!-- Кнопка запуска -->
            <button id="start-btn" class="mic-launch-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                Включить микрофон
            </button>
        </main>

        <!-- ВКЛАДКА МЕТРОНОМ -->
        <main id="metronome-tab" class="tab-content">
            <div class="metro-card">
                <div class="bpm-display-box">
                    <span id="bpm-val">120</span>
                    <span class="bpm-lbl">BPM</span>
                </div>

                <div class="bpm-stepper">
                    <button id="bpm-minus" class="step-ctrl">-</button>
                    <input type="range" id="bpm-slider" class="range-line" min="30" max="250" value="120">
                    <button id="bpm-plus" class="step-ctrl">+</button>
                </div>

                <div class="select-box-custom" id="metro-select">
                    <div class="select-head" id="metro-trigger">
                        <span id="metro-selected-text">Размер: 4 / 4 (Стандартный)</span>
                        <div class="select-arrow"></div>
                    </div>
                    <div class="select-dropdown" id="metro-options">
                        <div class="m-option active" data-val="4">4 / 4 (Стандартный)</div>
                        <div class="m-option" data-val="3">3 / 4 (Вальс)</div>
                        <div class="m-option" data-val="2">2 / 4 (Марш)</div>
                        <div class="m-option" data-val="6">6 / 8 (Сложный)</div>
                    </div>
                </div>

                <div id="dots-container" class="beat-dots"></div>

                <button id="metro-start-btn" class="mic-launch-btn">Запустить метроном</button>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js?v=8');
        }
    </script>
</body>
</html>
