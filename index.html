<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гитарный тюнер PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#121212">
</head>
<body>
    <div class="tuner-container">
        <h1>Гитарный тюнер</h1>
        <button id="start-btn">Включить микрофон</button>

        <div class="display" id="display" style="display: none;">
            <div id="note" class="note">--</div>
            <div id="frequency" class="frequency">0.0 Hz</div>
            <div id="cents" class="cents">0 центов</div>

            <div class="meter">
                <div class="meter-needle" id="needle"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
